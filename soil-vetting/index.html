<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-Oil 베팅 서류 체크</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --ink:#1F2933; --ink-2:#52606D; --muted:#8A94A0; --line:#E1E5EA;
    --ok:#1E7F4F; --ok-soft:#E3F4EA; --bad:#C0392B; --bad-soft:#FBE7E5; --warn:#A86500; --warn-soft:#FFF2DB;
    --na:#6B7280; --na-soft:#EEF0F2; --accent:#1F5FA8; --accent-soft:#E6EFFA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181D; --card:#1C2229; --ink:#E6EAEE; --ink-2:#B4BDC7; --muted:#7F8A96; --line:#2C343D;
      --ok:#5CC78F; --ok-soft:#183126; --bad:#F07A6C; --bad-soft:#3A1E1B; --warn:#F0B460; --warn-soft:#3A2C14;
      --na:#9AA3AD; --na-soft:#262D35; --accent:#6FA8EA; --accent-soft:#1A2B40;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181D; --card:#1C2229; --ink:#E6EAEE; --ink-2:#B4BDC7; --muted:#7F8A96; --line:#2C343D;
    --ok:#5CC78F; --ok-soft:#183126; --bad:#F07A6C; --bad-soft:#3A1E1B; --warn:#F0B460; --warn-soft:#3A2C14;
    --na:#9AA3AD; --na-soft:#262D35; --accent:#6FA8EA; --accent-soft:#1A2B40;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    font-size:15px;line-height:1.55}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row > label{flex:1 1 180px;font-size:12.5px;color:var(--ink-2)}
  input[type=text],input[type=number]{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:15px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--ink-2);transition:.15s}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop strong{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
  .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:hover{filter:brightness(.97)}
  .summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
  .p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)} .p-na{background:var(--na-soft);color:var(--na)}
  .verdict{font-size:17px;font-weight:700;margin-right:auto}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
  th{font-size:12px;color:var(--muted);font-weight:600;border-top:none}
  td.no{width:32px;color:var(--muted)}
  td.st{width:96px}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
  .t-ok{background:var(--ok-soft);color:var(--ok)} .t-bad{background:var(--bad-soft);color:var(--bad)}
  .t-warn{background:var(--warn-soft);color:var(--warn)} .t-na{background:var(--na-soft);color:var(--na)}
  .doc{font-weight:600}
  .note{font-size:12.5px;color:var(--muted)}
  .new{color:var(--bad);font-size:11px;font-weight:700;margin-left:4px}
  .files{margin:6px 0 0;padding:0;list-style:none}
  .files li{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;word-break:break-all}
  .files li button{padding:0 6px;font-size:11px;line-height:18px;color:var(--muted)}
  .chk{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;margin-top:6px}
  select{font:inherit;font-size:12.5px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
  .unk li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  .unk{list-style:none;margin:0;padding:0}
  .unk li span{word-break:break-all;font-size:13.5px}
  .empty{color:var(--muted);font-size:13px}
  @media (max-width:640px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tr{border-top:1px solid var(--line);padding:10px 0}
    td{border:none;padding:2px 0}
    td.no{display:inline-block;width:auto;margin-right:6px}
    td.st{display:inline-block;width:auto}
  }
  @media print{
    .noprint{display:none !important}
    body{background:#fff} .card{border-color:#ccc}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>S-Oil 베팅 서류 체크</h1>
  <p class="sub">파일을 올리면 필요서류가 빠짐없이 들어왔는지 파일명으로 자동 확인합니다. 파일은 이 브라우저 안에서만 처리되며 어디에도 업로드되지 않습니다.</p>

  <div class="card">
    <h2>선박 정보</h2>
    <div class="row">
      <label>선명 (Vessel name)<input type="text" id="vessel" placeholder="예: MT OCEAN STAR"></label>
      <label>건조년도 (Year built)<input type="number" id="built" placeholder="예: 2004" min="1950" max="2100"></label>
      <label>DWT (톤)<input type="number" id="dwt" placeholder="예: 46000" min="0"></label>
    </div>
    <p class="note" id="capNote" style="margin:10px 0 0"></p>
  </div>

  <div class="card noprint">
    <div class="drop" id="drop">
      <strong>여기에 파일·폴더·ZIP을 끌어다 놓으세요</strong>
      PDF, 엑셀, 워드, 이미지 등 모든 형식 · ZIP은 자동으로 풀어서 확인
      <div class="btns">
        <button class="primary" id="pickFiles">파일 선택</button>
        <button id="pickFolder">폴더 선택</button>
        <button id="reset">초기화</button>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
    </div>
  </div>

  <div class="card">
    <div class="summary">
      <span class="verdict" id="verdict">파일을 올려주세요</span>
      <span class="pill p-ok" id="cOk">수령 0</span>
      <span class="pill p-warn" id="cWarn">확인필요 0</span>
      <span class="pill p-bad" id="cBad">누락 0</span>
      <span class="pill p-na" id="cNa">해당없음 0</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="btns noprint" style="justify-content:flex-start">
      <button id="copyMissing">누락 목록 복사 (메일용)</button>
      <button id="copyAll">전체 결과 복사</button>
      <button id="print">인쇄 / PDF 저장</button>
    </div>
  </div>

  <div class="card">
    <h2>필요서류 체크리스트</h2>
    <table>
      <thead><tr><th>#</th><th>서류</th><th>상태</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <div class="card noprint">
    <h2>매칭되지 않은 파일 <span class="note" id="unkCount"></span></h2>
    <p class="note" style="margin:-6px 0 8px">파일명으로 서류를 알아내지 못한 파일입니다. 해당하는 서류를 직접 지정해 주세요.</p>
    <ul class="unk" id="unknown"></ul>
  </div>
</div>

<script>
/* ===================== 필요서류 정의 =====================
 * S-Oil 요구서류가 바뀌면 이 배열만 수정하면 됩니다.
 *  - keys : 파일명에 이 패턴 중 하나라도 있으면 해당 서류로 인식 (대소문자 무시)
 *  - manual : 파일이 들어와도 사람이 직접 확인해야 하는 사항 (체크해야 '수령' 처리)
 *  - cap : CAP 조건부 항목 (선령 20년 초과 또는 DWT 5,000톤 초과 시에만 필요)
 */
const REQUIRED = [
  { id:'quest', name:'S-Oil questionnaire rev.9 (including additional document)',
    keys:[/s ?oil/, /questionnaire/, /q ?naire/, /질의서/, /설문/],
    manual:'Rev.9 버전 및 additional document 포함 여부 확인' },
  { id:'q88', name:'Q88', keys:[/q ?88/] },
  { id:'class', name:'Class survey status report',
    keys:[/class/, /survey status/, /status report/, /\bcss\b/, /선급/, /검사 ?현황/] },
  { id:'ga', name:'General arrangement (all graphics to be legible)',
    keys:[/general arrangement/, /\bg ?a\b/, /\bga ?(plan|dwg|drawing)/, /일반 ?배치/],
    manual:'도면 가독성(legible) 확인' },
  { id:'fcp', name:'Fire control and safety plan (all graphics to be legible)',
    keys:[/fire/, /safety plan/, /\bfcp\b/, /\bfsp\b/, /\bfcsp\b/, /소방/, /방화/],
    manual:'도면 가독성(legible) 확인' },
  { id:'manifold', name:'Manifold arrangement (including vapor return line)',
    keys:[/manifold/, /매니폴드/],
    manual:'Vapor return line 포함 여부 확인' },
  { id:'gangway', name:'5 yearly load test certificate of accommodation ladder/gangway',
    keys:[/gangway/, /accommodation ladder/, /acc ?ladder/, /accom/, /load ?test/, /loat ?test/, /갱웨이/, /사다리/, /하중 ?시험/] },
  { id:'psc', name:'Latest PSC report and rectification evidence',
    keys:[/psc/, /\bp ?s ?c\b/, /port state/, /tokyo ?mou/, /paris ?mou/, /indian ?(ocean )?mou/, /uscg/, /amsa/, /form ?a\b/, /form ?b\b/, /inspection report/, /항만 ?국가/, /항만 ?통제/] },
  { id:'pscrect', name:'Latest PSC rectification evidence',
    keys:[/rectif/, /corrective/, /close ?out/, /closing/, /evidence/, /시정/, /조치/] },
  { id:'crew', name:'Crew matrix', keys:[/crew/, /matrix/, /승무원/, /선원/] },
  { id:'vef', name:'VEF', keys:[/\bvef\b/, /vessel experience/, /experience factor/] },
  { id:'ports', name:'Last 10 port of call list',
    keys:[/last ?10/, /port ?of ?call/, /ports? ?call/, /port ?history/, /\bpoc\b/, /기항/] },
  { id:'cargo3', name:'Last 3 cargoes', isNew:true,
    keys:[/last ?(3|three) ?cargo/, /last ?cargo/, /previous ?cargo/, /prev ?cargo/, /cargo ?history/, /화물 ?이력/, /전 ?화물/, /직전 ?화물/] },
  { id:'cap', name:'CAP Certification (Over 20 Year Olds, DWT Over 5KT)', isNew:true, cap:true,
    keys:[/\bcap\b/, /condition assessment/, /\bcap ?(cert|certificate|report)/] },
];

/* ===================== 상태 ===================== */
const state = {
  files: [],          // {id, name, path}
  override: {},       // fileId -> docId | '__ignore'
  manualOk: {},       // docId -> true
  removed: {},        // docId -> {fileId:true}  자동매칭 해제
  forceNa: {},        // docId -> true  사용자가 해당없음 지정
  extra: {},          // docId -> [fileId]  이미 다른 서류에 쓰인 파일을 이 서류에도 지정
};
let seq = 0;

const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/\.[a-z0-9]{1,5}$/,'').replace(/[_\-.()\[\]{}+,&#~]+/g,' ').replace(/\s+/g,' ').trim();

function autoMatch(file){
  const n = norm(file.name);
  const p = norm(file.path || '');
  const hits = REQUIRED.filter(d => d.keys.some(k => k.test(n)));
  if (hits.length) return hits.map(d => d.id);
  // 파일명으로 안 잡히면 폴더명으로 한 번 더
  return REQUIRED.filter(d => d.keys.some(k => k.test(p))).map(d => d.id);
}

function capRequired(){
  const built = parseInt($('built').value, 10);
  const dwt = parseFloat($('dwt').value);
  const year = new Date().getFullYear();
  const known = !isNaN(built) || !isNaN(dwt);
  if (!known) return null;              // 정보 없음 → 필요한 것으로 간주
  const old = !isNaN(built) && (year - built) > 20;
  const big = !isNaN(dwt) && dwt > 5000;
  return old || big;
}

function computeAssignments(){
  const byDoc = {}; REQUIRED.forEach(d => byDoc[d.id] = []);
  const unknown = [];
  for (const f of state.files){
    const ov = state.override[f.id];
    if (ov === '__ignore') continue;
    let ids = ov ? [ov] : autoMatch(f).filter(id => !(state.removed[id] && state.removed[id][f.id]));
    if (!ids.length) { unknown.push(f); continue; }
    ids.forEach(id => byDoc[id].push(f));
  }
  for (const [docId, fids] of Object.entries(state.extra)){
    fids.forEach(fid => {
      const f = state.files.find(x => x.id === fid);
      if (f && !byDoc[docId].includes(f)) byDoc[docId].push(f);
    });
  }
  return {byDoc, unknown};
}

function statusOf(doc, files){
  if (state.forceNa[doc.id]) return 'na';
  if (doc.cap && capRequired() === false) return 'na';
  if (!files.length) return 'bad';
  if (doc.manual && !state.manualOk[doc.id]) return 'warn';
  return 'ok';
}
const LABEL = {ok:'✓ 수령', warn:'△ 확인필요', bad:'✗ 누락', na:'— 해당없음'};

/* ===================== 렌더 ===================== */
function render(){
  const {byDoc, unknown} = computeAssignments();
  const capReq = capRequired();
  const age = parseInt($('built').value,10);
  $('capNote').textContent = capReq === null
    ? 'CAP 인증서: 건조년도 또는 DWT를 입력하면 필요 여부를 자동 판단합니다. (입력 전에는 필요서류로 간주)'
    : capReq ? `CAP 인증서 필요 — 선령 ${isNaN(age)?'?':(new Date().getFullYear()-age)}년 / DWT ${$('dwt').value||'?'}t (20년 초과 또는 5,000t 초과)`
             : 'CAP 인증서 불필요 — 선령 20년 이하이고 DWT 5,000t 이하';

  const counts = {ok:0,warn:0,bad:0,na:0};
  const tb = $('list'); tb.innerHTML = '';
  REQUIRED.forEach((d, i) => {
    const files = byDoc[d.id];
    const st = statusOf(d, files); counts[st]++;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="no">${i+1}</td>
      <td><div class="doc">${esc(d.name)}${d.isNew?'<span class="new">NEW</span>':''}</div>
        <ul class="files"></ul><div class="extra"></div></td>
      <td class="st"><span class="tag t-${st}">${LABEL[st]}</span></td>`;
    const ul = tr.querySelector('.files');
    files.forEach(f => {
      const li = document.createElement('li');
      li.innerHTML = `📄 <span>${esc(f.path || f.name)}</span>`;
      const b = document.createElement('button'); b.textContent = '빼기'; b.className='noprint';
      b.title = '이 서류에서 이 파일을 제외';
      b.onclick = () => {
        if (state.extra[d.id] && state.extra[d.id].includes(f.id)) state.extra[d.id] = state.extra[d.id].filter(x => x !== f.id);
        else if (state.override[f.id] === d.id) delete state.override[f.id];
        else (state.removed[d.id] ||= {})[f.id] = true;
        render();
      };
      li.appendChild(b); ul.appendChild(li);
    });
    const ex = tr.querySelector('.extra');
    if (d.manual && files.length && st !== 'na'){
      const lab = document.createElement('label'); lab.className='chk';
      lab.innerHTML = `<input type="checkbox" ${state.manualOk[d.id]?'checked':''}> ${esc(d.manual)}`;
      lab.querySelector('input').onchange = e => { state.manualOk[d.id] = e.target.checked; render(); };
      ex.appendChild(lab);
    }
    if (st !== 'na' && state.files.length){
      const sel = document.createElement('select'); sel.className='noprint'; sel.style.marginTop='6px';
      sel.innerHTML = '<option value="">+ 올린 파일 중에서 이 서류로 지정…</option>' +
        state.files.filter(f => !files.includes(f)).map(f => `<option value="${f.id}">${esc(f.path || f.name)}</option>`).join('');
      sel.onchange = () => {
        const fid = +sel.value; if (!fid) return;
        if (state.removed[d.id]) delete state.removed[d.id][fid];
        (state.extra[d.id] ||= []).push(fid); render();
      };
      ex.appendChild(sel);
    }
    if (!d.cap || capReq !== false){
      const lab = document.createElement('label'); lab.className='chk noprint';
      lab.innerHTML = `<input type="checkbox" ${state.forceNa[d.id]?'checked':''}> 이 선박은 해당없음`;
      lab.querySelector('input').onchange = e => { state.forceNa[d.id] = e.target.checked; render(); };
      ex.appendChild(lab);
    }
    tb.appendChild(tr);
  });

  // 매칭 안 된 파일
  const uk = $('unknown'); uk.innerHTML = '';
  $('unkCount').textContent = unknown.length ? `(${unknown.length})` : '';
  if (!unknown.length) uk.innerHTML = `<li class="empty">${state.files.length?'모든 파일이 서류에 매칭되었습니다.':'아직 올린 파일이 없습니다.'}</li>`;
  unknown.forEach(f => {
    const li = document.createElement('li');
    li.innerHTML = `<span>📄 ${esc(f.path || f.name)}</span>`;
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">서류 지정…</option>' +
      REQUIRED.map((d,i)=>`<option value="${d.id}">${i+1}. ${esc(d.name)}</option>`).join('') +
      '<option value="__ignore">무시 (관련없는 파일)</option>';
    sel.onchange = () => { if (sel.value) { state.override[f.id] = sel.value; render(); } };
    li.appendChild(sel); uk.appendChild(li);
  });

  // 요약
  const need = REQUIRED.length - counts.na;
  $('cOk').textContent = `수령 ${counts.ok}`; $('cWarn').textContent = `확인필요 ${counts.warn}`;
  $('cBad').textContent = `누락 ${counts.bad}`; $('cNa').textContent = `해당없음 ${counts.na}`;
  $('barFill').style.width = need ? (counts.ok/need*100)+'%' : '100%';
  const v = $('verdict');
  if (!state.files.length) { v.textContent = '파일을 올려주세요'; v.style.color=''; }
  else if (counts.bad) { v.textContent = `누락 ${counts.bad}건 — 추가 요청 필요`; v.style.color='var(--bad)'; }
  else if (counts.warn) { v.textContent = `모두 수령 · 확인필요 ${counts.warn}건`; v.style.color='var(--warn)'; }
  else { v.textContent = '✓ 모든 서류 수령 완료'; v.style.color='var(--ok)'; }
  window._last = {byDoc, counts};
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== 파일 입력 ===================== */
async function addFiles(list){
  for (const file of list){
    const path = file.webkitRelativePath || file._path || '';
    if (/\.zip$/i.test(file.name) && window.JSZip){
      try {
        const zip = await JSZip.loadAsync(file);
        zip.forEach((p, entry) => {
          if (entry.dir) return;
          const base = p.split('/').pop();
          if (!base || base.startsWith('.') || p.startsWith('__MACOSX')) return;
          state.files.push({id:++seq, name:base, path:file.name+' › '+p});
        });
        continue;
      } catch(e){ /* 읽기 실패 시 일반 파일로 취급 */ }
    }
    if (file.name.startsWith('.')) continue;
    state.files.push({id:++seq, name:file.name, path});
  }
  render();
}

async function readEntry(entry, prefix, out){
  if (entry.isFile){
    await new Promise(res => entry.file(f => { f._path = prefix + f.name; out.push(f); res(); }, res));
  } else if (entry.isDirectory){
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise(res => reader.readEntries(res, () => res([])));
      for (const e of batch) await readEntry(e, prefix + entry.name + '/', out);
    } while (batch.length);
  }
}

const drop = $('drop');
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', async e => {
  const items = [...(e.dataTransfer.items || [])];
  if (items.length && items[0].webkitGetAsEntry){
    const out = [];
    for (const it of items){ const en = it.webkitGetAsEntry(); if (en) await readEntry(en, '', out); }
    addFiles(out);
  } else addFiles([...e.dataTransfer.files]);
});
$('pickFiles').onclick = () => $('fileInput').click();
$('pickFolder').onclick = () => $('folderInput').click();
$('fileInput').onchange = e => { addFiles([...e.target.files]); e.target.value=''; };
$('folderInput').onchange = e => { addFiles([...e.target.files]); e.target.value=''; };
$('reset').onclick = () => {
  if (state.files.length && !confirm('올린 파일 목록과 체크 상태를 모두 지울까요?')) return;
  state.files=[]; state.override={}; state.manualOk={}; state.removed={}; state.forceNa={}; state.extra={}; render();
};
['built','dwt','vessel'].forEach(id => $(id).addEventListener('input', render));

/* ===================== 내보내기 ===================== */
function reportText(onlyMissing){
  const {byDoc} = window._last;
  const vessel = $('vessel').value.trim();
  const lines = [];
  const missing = [], warn = [];
  REQUIRED.forEach((d,i) => {
    const st = statusOf(d, byDoc[d.id]);
    if (st==='bad') missing.push(`${i+1}. ${d.name}`);
    if (st==='warn') warn.push(`${i+1}. ${d.name} — ${d.manual}`);
    if (!onlyMissing) lines.push(`[${LABEL[st]}] ${i+1}. ${d.name}` +
      (byDoc[d.id].length && st!=='na' ? `\n      - ${byDoc[d.id].map(f=>f.name).join('\n      - ')}` : ''));
  });
  const head = `S-Oil Vetting documents${vessel?' — '+vessel:''} (${new Date().toISOString().slice(0,10)})`;
  if (onlyMissing){
    if (!missing.length && !warn.length) return head + '\nAll required documents received.';
    let t = head;
    if (missing.length) t += '\n\nPlease provide the following missing documents:\n' + missing.join('\n');
    if (warn.length) t += '\n\nPlease check / confirm:\n' + warn.join('\n');
    return t;
  }
  return head + '\n\n' + lines.join('\n');
}
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const o = btn.textContent; btn.textContent = '복사됨 ✓'; setTimeout(()=>btn.textContent=o, 1400);
}
$('copyMissing').onclick = e => copy(reportText(true), e.target);
$('copyAll').onclick = e => copy(reportText(false), e.target);
$('print').onclick = () => window.print();

render();
</script>
